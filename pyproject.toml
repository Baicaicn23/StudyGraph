[project]
name = "zhiji"
version = "0.1.0"
description = "A LangGraph-orchestrated personal study assistant for university students"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pypdf",
    "python-dotenv",
    "ddgs>=9.16.0",
    "httpx>=0.28.1",
    "markitdown[docx,pptx,xlsx]>=0.1.8",
    "jieba>=0.42.1",
    "trafilatura>=2.3.1",
]

[project.optional-dependencies]
openai = ["langchain-openai"]

[project.scripts]
zhiji = "zhiji.interfaces.cli:main"
zhiji-demo = "zhiji.interfaces.demo:main"
zhiji-eval = "zhiji.interfaces.evals:main"
zhiji-trace = "zhiji.interfaces.trace:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zhiji"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 这个脚本的主体是**长篇中文教材内容**（演示素材的正文），属数据而非代码逻辑：
# 把每段硬折到 100 列以内会让内容难以校对，故豁免行长限制。
"scripts/build_demo_materials.py" = ["E501"]
# 幻灯片构建器：主体是长串 JSX 风格的 deckkit 调用，长行不可折。
"scripts/build_deck.py" = ["E501"]
# 图生成器：SVG 坐标与文案成对出现，硬折行会把「x, y, 文本」拆散，反而难读难改。
"scripts/make_overview_figure.py" = ["E501"]
