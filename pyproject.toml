[project]
name = "studygraph"
version = "0.1.0"
description = "A LangGraph-orchestrated personal study assistant for university students"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pypdf",
]

[project.optional-dependencies]
openai = ["langchain-openai"]

[project.scripts]
studygraph = "studygraph.interfaces.cli:main"
studygraph-demo = "studygraph.interfaces.demo:main"
studygraph-eval = "studygraph.interfaces.evals:main"
studygraph-trace = "studygraph.interfaces.trace:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studygraph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
